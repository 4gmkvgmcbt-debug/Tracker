name: Radar Pokemon TCG

on:
  schedule:
    - cron: '*/5 * * * *' # Inicia automaticamente a cada 5 minutos
  workflow_dispatch:      # Botão para iniciar manualmente quando quiser

permissions:
  contents: write         # Permite salvar o histórico de preços no repositório

concurrency:
  group: radar-pokemon-group
  cancel-in-progress: false # Impede que duas instâncias rodem ao mesmo tempo

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: |
          pip install curl_cffi beautifulsoup4 pyTelegramBotAPI aiohttp

      - name: Executar Radar por 4m20s
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: 'America/Sao_Paulo'
        run: |
          python script.py

      - name: Salvar Histórico Atualizado no Repositório
        run: |
          git config --global user.name "Radar Bot"
          git config --global user.email "bot@noreply.github.com"
          git pull --rebase origin main || true
          git add historico_precos.json estado_bot.json || true
          git diff --staged --quiet || git commit -m "chore: atualiza historico de precos [skip ci]"
          git push || true
